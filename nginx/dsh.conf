# DSH for TOS -- nginx reverse proxy (external tab / new-window mode)
#
# How it is loaded: TOS includes the *.conf files of this directory **inside
# the main server block** (not the http block), so only `location` entries are
# allowed here; no `server`. Verified on real hardware with `nginx -t`.
#
# Key point (with or without the trailing slash -- pick one):
#   This app runs with the prefix **stripped**, so proxy_pass must end with /**:
#       /dsh/assets/x.js  ->  http://127.0.0.1:18142/assets/x.js
#   The DSH home page uses <base href="./"> and all asset paths are relative
#   (measured: 0 absolute paths), so after stripping the prefix the browser
#   resolves ./assets back to /dsh/assets -- they line up.
#   NOTE: this is the opposite of Pi Agent for TOS, which builds with
#   basePath=/piagentfortos and therefore must **not** strip the prefix.
#
# ^~ is required: TOS "app access control" generates regex locations (higher
# priority than a plain prefix). Without ^~ the request falls through to
# try_files and the app never opens (the same pitfall is documented in the Pi
# Agent config).

# Per-install random secret, injected into the upstream request so the DSH
# plugin can tell "came through the TOS web route" apart from direct loopback
# access. postinst replaces the placeholder with the generated value before the
# file is deployed; the value never ships in the package.
set $dsh_gate "__DSH_GATE_SECRET__";

# Provide a **relative** redirect when the trailing slash is missing. Do not
# rely on the platform adding it: measured behavior is a 301 to
# https://<host>/ (dropping the port), landing on the platform default site.
location = /dsh {
    absolute_redirect off;
    return 302 /dsh/;
}

# Compatibility redirect from the old app id (/sh-dsh/): the app id has been
# `dsh` since 1.3.0.
location = /sh-dsh {
    absolute_redirect off;
    return 302 /dsh/;
}
location ^~ /sh-dsh/ {
    absolute_redirect off;
    return 302 /dsh/;
}

# Mobile "coming soon" page: a local static page, independent of whether the
# external repository has been published.
location = /dsh/mobile {
    alias /usr/local/dsh/nginx/mobile.html;
    default_type text/html;
    add_header Cache-Control "no-store";
}

# Usage and balance: local sidecar (read-only credentials, only talks to
# api.deepseek.com).
location = /dsh/usage {
    proxy_pass http://127.0.0.1:18145/usage;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 40s;
    add_header Cache-Control "no-store";
}

location ^~ /dsh/ui/ {
    proxy_pass http://127.0.0.1:18142/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # The value comes from the auth endpoint's response header (per-install
    # random secret); nginx overwrites any client-supplied value of the same
    # name, so a local process cannot forge it.
    proxy_set_header X-Dsh-Gate $dsh_gate;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 64m;
}

location ^~ /dsh/ {
    proxy_pass http://127.0.0.1:18142/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Per-install secret returned by the auth endpoint (overrides any
    # client-supplied value of the same header name).
    proxy_set_header X-Dsh-Gate $dsh_gate;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 64m;

}



